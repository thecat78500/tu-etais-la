<circle cx="550" cy="281" r="112" fill="url(#metal)"/><circle cx="550" cy="281" r="95" fill="url(#verre)"/><path d="M550 281L608 222" stroke="#d8ba7d" stroke-width="5"/><circle cx="550" cy="281" r="10" fill="#c7a66c"/>
