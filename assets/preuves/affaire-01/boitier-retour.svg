<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="titre description">
<title id="titre">Le boîtier de retour de la Galerie</title><desc id="description">Un loquet garde le rempart fermé. Un câble rejoint la borne Galerie. Une plaque de contrôle et un cadran servent à régler le retour. Un capot protège la commande d’ouverture jusqu’au vote. Les cinq gestes sont présentés sans ordre.</desc>
