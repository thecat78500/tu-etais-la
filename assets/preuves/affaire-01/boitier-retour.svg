<g font-family="Georgia,serif" text-anchor="middle" fill="#e5d8bd"><text x="215" y="203" font-size="19">LOQUET DU REMPART</text><text x="550" y="291" font-size="15">SEUIL</text><text x="880" y="203" font-size="19">PLAQUE DE CONTRÔLE</text><text x="880" y="254" font-size="17" fill="#282c28">RELAIS DU TRAJET</text><text x="267" y="582" font-size="19">BORNE GALERIE</text><text x="823" y="608" font-size="19">CAPOT D’OUVERTURE</text><text x="550" y="659" font-size="17" fill="#c5aa76">Les feuillets privés donnent l’ordre. Gardez le capot fermé jusqu’au vote.</text></g>
