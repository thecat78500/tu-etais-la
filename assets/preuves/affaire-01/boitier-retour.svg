<g fill="#c1a46e" stroke="#231f19" stroke-width="4"><circle cx="51" cy="50" r="9"/><circle cx="1049" cy="50" r="9"/><circle cx="51" cy="670" r="9"/><circle cx="1049" cy="670" r="9"/></g>
<g font-family="Georgia,serif" fill="#eee4cf" text-anchor="middle"><text x="550" y="80" font-size="31">LE RETOUR SOUS PROTECTION</text><text x="550" y="111" font-size="16" letter-spacing="3" fill="#c5aa76">GALERIE · ARCHIVE DES GARDIENS</text></g>
<path d="M300 350C300 460 650 470 740 330" fill="none" stroke="#201c18" stroke-width="17"/><path d="M300 350C300 460 650 470 740 330" fill="none" stroke="#92724b" stroke-width="9"/>
