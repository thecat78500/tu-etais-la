# Fragment à placer DANS le bloc server HTTPS existant, à côté du location / de n8n.
# Remplacer IP_LOCALE_LXC_N8N par l'IP privée du LXC n8n, pas l'IP publique.
# Ne pas remplacer toute la configuration n8n par ce fragment.
location /jeu-medias/ {
    client_max_body_size 30m;
    client_body_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering on;
    proxy_pass http://IP_LOCALE_LXC_N8N:8787/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
